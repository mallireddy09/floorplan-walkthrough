<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1e21" />
    <title>Floor plan walk-through</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="room" aria-live="polite">Hall</div>

    <div id="mapbox">
      <canvas id="map"></canvas>
    </div>

    <div id="buttons">
      <div id="button-list">
        <button id="plumb" type="button">Plumbing &amp; Drainage</button>
        <button id="style" type="button">Real style</button>
        <button id="time" type="button">Night</button>
        <button id="toggle" type="button">Top view</button>
        <button id="whole" type="button">Whole house</button>
      </div>
      <button id="menu" type="button" aria-expanded="false" aria-controls="button-list">Menu</button>
    </div>

    <button id="enter" type="button">Enter</button>

    <div id="hint"></div>

    <div id="plumbing" hidden>
      <div class="p-title"><span>Plumbing &amp; Drainage</span><button type="button" id="p-collapse" aria-expanded="true">Hide</button></div>
      <div class="p-seg" role="group" aria-label="View">
        <button type="button" data-view="house" aria-pressed="true">House view</button>
        <button type="button" data-view="water" aria-pressed="false">Water supply</button>
        <button type="button" data-view="drainage" aria-pressed="false">Drainage</button>
      </div>
      <div id="p-body">
      <div class="p-sub">Systems</div>
      <div id="p-layers"></div>
      <div class="p-sub">View</div>
      <label class="p-row"><input type="checkbox" id="p-section" /><span class="p-name">Section</span></label>
      <input type="range" id="p-cut" min="-6" max="11.8" step="0.1" value="5.6" aria-label="Section position, north to south" disabled />
      <label class="p-row"><input type="checkbox" id="p-labels" checked /><span class="p-name">Labels</span></label>
      <div id="p-hint"></div>
      </div>
    </div>

    <div id="p-info" hidden></div>

    <div id="stick" aria-label="Move"><div id="knob"></div></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
